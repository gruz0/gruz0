name: Update recent articles

# The blog publishes ~3x/week, so a daily check keeps the profile at most a day
# behind. It only commits when the list actually changed, so quiet days are free.
on:
  schedule:
    - cron: '17 11 * * *' # daily, 11:17 UTC — articles publish at 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate list from feed
        run: node scripts/update-articles.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update recent articles from feed'
          git push
